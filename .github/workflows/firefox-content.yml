name: Firefox 课程验证

# 在 Firefox 中运行全部课程的示例与练习变体（content:verify 的 Firefox 版本，约 20 分钟）。
# 验证记录（content/verification.json）以 Chromium 的结果为准，这里只报告失败项。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'content/**'
      - 'sandbox/**'
      - 'src/runner/**'
      - 'src/compiler/**'
      - 'src/verify/**'
      - 'playwright.config.ts'
      - '.github/workflows/firefox-content.yml'

jobs:
  verify:
    name: 全部课程（Firefox）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npm run build
      - run: npm run content:verify:firefox
