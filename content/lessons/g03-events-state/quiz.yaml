- id: three-sets
  type: single
  prompt: |
    `count` 当前为 0。点击按钮后，下一次渲染时 `count` 是多少？

    ```tsx
    <button onClick={() => {
      setCount(count + 1);
      setCount(count + 1);
      setCount(count + 1);
    }}>+3</button>
    ```
  options:
    - text: "1"
      correct: true
      explain: 这次渲染里 `count` 固定为 0，三次调用都是 `setCount(0 + 1)`。要加 3，需要写成 `setCount((c) => c + 1)` 三次，或直接 `setCount(count + 3)`。
    - text: "3"
      explain: 这是把 `setCount` 当成普通赋值的结果。state 在当前渲染中是快照，设置函数不会改变已经读到的 `count`。
    - text: "0"
      explain: 设置 state 会安排一次重新渲染，下一次渲染时值会变化——只是三次都设置成了 1。
- id: handler-call
  type: single
  prompt: |
    下面哪一种写法会在**每次渲染时**就调用 `remove(id)`，而不是在点击时？
  options:
    - text: "`<button onClick={remove(id)}>删除</button>`"
      correct: true
      explain: 花括号里的表达式在渲染时求值，于是 `remove(id)` 立即执行，`onClick` 拿到的是它的返回值。
    - text: "`<button onClick={() => remove(id)}>删除</button>`"
      explain: 这里传入的是一个新函数，只有点击时才会调用 `remove(id)`。
    - text: "`<button onClick={handleRemove}>删除</button>`（`handleRemove` 是组件里定义的函数）"
      explain: 传入函数本身，React 会在点击时调用它。
- id: null-state
  type: single
  prompt: |
    下面的代码在第二行报类型错误。最合适的修改是什么？

    ```tsx
    const [selected, setSelected] = useState(null);
    setSelected('ts');
    ```
  options:
    - text: 改成 `useState<string | null>(null)`
      correct: true
      explain: 只传 `null` 时，TypeScript 只能推断出 `null` 类型。显式写出 `string | null` 后，既可以是 `null` 也可以是字符串。
    - text: 改成 `useState<any>(null)`
      explain: "`any` 会关闭类型检查，之后把数字甚至对象设置进去也不会报错。"
    - text: 改成 `setSelected('ts' as null)`
      explain: 断言骗过了编译器，却让 state 的类型与真实的值不一致。
    - text: 这是 React 的 bug，无法修复
      explain: 这是类型推断的正常行为：初始值决定了推断出的类型。
