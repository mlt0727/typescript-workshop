- id: when-detected
  type: multiple
  prompt: 下列问题中，哪些**在运行之前**就会被 TypeScript 报告？
  options:
    - text: 读取一个已知对象类型上不存在的属性，例如 `user.age`
      correct: true
      explain: TypeScript 知道对象的形状，会报 TS2339。运行时这只会静默地得到 `undefined`。
    - text: 调用 `toUpperCase()` 时传给它的对象来自 `JSON.parse`，且实际不是字符串
      explain: "`JSON.parse` 返回 `any`，TypeScript 不知道真实内容，只能在运行时才暴露问题。"
    - text: 把字符串传给声明了 `number` 参数的函数
      correct: true
      explain: 参数类型不匹配会在编译期报错（TS2345）。
    - text: 计算 `1 / 0`
      explain: 在 JavaScript 里 `1 / 0` 得到 `Infinity`，既不是类型错误，也不会抛出异常。
- id: typeof-null
  type: single
  prompt: "`console.log(typeof null, typeof [])` 输出什么？"
  options:
    - text: "`object object`"
      correct: true
      explain: "`typeof null` 是 `'object'`（历史遗留问题），数组的 `typeof` 也是 `'object'`。判断数组要用 `Array.isArray`，判断 null 要用 `=== null`。"
    - text: "`null array`"
      explain: "`typeof` 不会返回 `'null'` 或 `'array'`。"
    - text: "`undefined object`"
      explain: "`typeof null` 是 `'object'`，不是 `'undefined'`。"
    - text: "`object array`"
      explain: 数组的 `typeof` 结果是 `'object'`。
- id: type-alias-js
  type: single
  prompt: "`type Meters = number;` 这一行编译成 JavaScript 后是什么？"
  options:
    - text: 什么都没有：整行被删除
      correct: true
      explain: "`type` 声明只在编译期存在，类型擦除后不留下任何代码。可以在示例里点“查看 JS”验证。"
    - text: "`const Meters = Number;`"
      explain: 类型别名不会生成任何运行时值。
    - text: 一个运行时用来检查数值的函数
      explain: TypeScript 不会根据类型自动生成运行时检查代码，需要检查时要自己写。
