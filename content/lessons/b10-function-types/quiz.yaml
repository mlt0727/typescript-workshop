- id: fewer-params
  type: single
  prompt: "`type Visitor = (value: string, index: number) => void;` 下列哪个函数**不能**赋给 `Visitor` 类型的变量？"
  options:
    - text: "`(value: string, index: number, extra: boolean) => {}`"
      correct: true
      explain: 它需要第三个参数，但 `Visitor` 的调用方只会传两个。
    - text: "`(value: string) => {}`"
      explain: 参数更少是允许的，多传的参数会被忽略。
    - text: "`() => {}`"
      explain: 一个参数都不用也可以。
- id: param-direction
  type: single
  prompt: "`type Handler = (value: string | number) => void;` 为什么 `const h: Handler = (text: string) => {};` 报错？"
  options:
    - text: "`Handler` 的调用方可能传入数字，而这个函数只能处理字符串"
      correct: true
      explain: 函数类型承诺能处理 `string | number`，赋给它的函数必须真的能处理这两种值。
    - text: 参数名不一致
      explain: 函数类型中的参数名只用于可读性，不参与兼容性检查。
    - text: 箭头函数不能赋给类型别名
      explain: 可以赋值，问题在于参数类型更窄。
    - text: 返回类型不一致
      explain: 两边都返回 `void`。
- id: optional-callback
  type: single
  prompt: 写一个接收回调的函数，而且你总是会把下标传给回调。回调类型应该怎么写？
  options:
    - text: "`(item: string, index: number) => void`"
      correct: true
      explain: 总会传的参数就写成必需参数；不需要下标的回调可以直接少写参数。
    - text: "`(item: string, index?: number) => void`"
      explain: 可选参数会迫使每个实现回调的人处理 `undefined`，而实际上你总会传。
    - text: "`(...args: any[]) => void`"
      explain: 这样会失去所有类型检查。
- id: method-vs-property
  type: single
  prompt: 在接口中声明回调成员，哪种写法能让 TypeScript 严格检查参数类型？
  options:
    - text: "属性写法：`onChange: (value: string) => void;`"
      correct: true
      explain: 属性写法受 `strictFunctionTypes` 检查。
    - text: "方法写法：`onChange(value: string): void;`"
      explain: 方法写法出于历史原因不按 `strictFunctionTypes` 严格检查参数类型。
    - text: 两种写法完全一样
      explain: 它们在参数类型的检查上有区别。
