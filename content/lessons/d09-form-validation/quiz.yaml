- id: formdata-type
  type: single
  prompt: "`new FormData(form).get('age')` 的类型是什么？"
  options:
    - text: "`FormDataEntryValue | null`，也就是 `string | File | null`"
      correct: true
      explain: 文件上传控件的值是 File；没有这个名字时是 null。数字输入框的值也是字符串。
    - text: "`number | null`"
      explain: FormData 中的值都是字符串（或文件），不会自动转换成数字。
    - text: "`string`"
      explain: 还可能是 File 或 null，使用前要先确认是字符串。
- id: number-empty
  type: single
  prompt: 年龄输入框没有填写，`Number(data.get('age'))` 会得到什么？
  options:
    - text: "`0`"
      correct: true
      explain: 空输入的值是空字符串，`Number('')` 是 0，“没填”会被当作 0。要先判断空字符串。
    - text: "`NaN`"
      explain: "`Number('')` 是 0；`Number('abc')` 才是 NaN。"
    - text: "`null`"
      explain: 值是空字符串而不是 null；即使是 null，`Number(null)` 也是 0。
- id: parse-result
  type: single
  prompt: "解析函数返回 `{ ok: true; value: Data } | { ok: false; errors: … }`，而不是 `{ ok: boolean; value?: Data; errors?: … }`。好处是什么？"
  options:
    - text: 检查 `result.ok` 之后，TypeScript 能确定 value 或 errors 一定存在
      correct: true
      explain: 这是 b09 的可辨识联合。后一种写法中，即使 ok 为 true，TypeScript 也认为 value 可能是 undefined。
    - text: 运行速度更快
      explain: 区别在类型，不在运行时。
    - text: 可以同时返回数据和错误
      explain: 正好相反，联合类型保证两者只有一个。
- id: accessible-errors
  type: multiple
  prompt: 用 `novalidate` 接管错误显示后，哪些做法能让错误对所有用户可见？
  options:
    - text: 错误文字通过 `aria-describedby` 关联到输入框
      correct: true
      explain: 屏幕阅读器在聚焦输入框时会读出错误信息。
    - text: 不合格的输入框设置 `aria-invalid="true"`，改正后移除
      correct: true
      explain: 屏幕阅读器会读出“无效”。过时的状态同样会误导用户。
    - text: 提交失败后把焦点移到第一个有错误的输入框
      correct: true
      explain: 键盘和屏幕阅读器用户能立刻知道问题在哪里。
    - text: 只把输入框的边框变成红色
      explain: 只靠颜色，色觉障碍和屏幕阅读器用户都无法得知出了错。
