- id: fetch-404
  type: single
  prompt: 服务器对 `fetch('/api/users/999')` 返回了 404。下面哪种说法正确？
  options:
    - text: fetch 兑现为一个 `ok` 为 `false`、`status` 为 404 的 Response
      correct: true
      explain: 只要服务器给出了响应，fetch 就会兑现；要自己检查 `response.ok` 或 `status`。
    - text: fetch 以一个 TypeError 拒绝
      explain: fetch 只在请求没能完成时（例如断网）才被拒绝。
    - text: fetch 返回 null
      explain: fetch 总是返回 Promise，404 时它兑现为 Response。
- id: json-type
  type: single
  prompt: "`const data = await response.json();` 中，`data` 的类型是什么？应该怎么处理？"
  options:
    - text: "`any`；应该赋给 `unknown` 类型的变量，验证之后再使用"
      correct: true
      explain: 标准库把 `json()` 的返回类型写成 `Promise<any>`，TypeScript 不会检查你如何使用它。
    - text: 根据服务器返回的内容自动推断出准确的类型
      explain: TypeScript 在编译期无法知道服务器会返回什么。
    - text: "`unknown`，TypeScript 会强制你检查"
      explain: 它是 any，必须自己写上 unknown 注解才会受到保护。
- id: post-json
  type: multiple
  prompt: 用 fetch 发送一个 JSON 对象创建数据，需要哪些设置？
  options:
    - text: "`method: 'POST'`"
      correct: true
      explain: 默认的方法是 GET，GET 请求不能带请求体。
    - text: "`body: JSON.stringify(data)`"
      correct: true
      explain: 请求体要是字符串（或其他可发送的类型），直接传对象会被转成 "[object Object]"。
    - text: "`headers: { 'Content-Type': 'application/json' }`"
      correct: true
      explain: 告诉服务器请求体是 JSON。
    - text: "`response: 'json'`"
      explain: fetch 没有这个选项；读取响应时调用 `response.json()`。
- id: query-string
  type: single
  prompt: 搜索关键词是 `C & C++`。构造查询地址最好的方式是？
  options:
    - text: "`url.searchParams.set('q', keyword)`"
      correct: true
      explain: URLSearchParams 会把 `&`、`+`、空格等字符正确编码。
    - text: "`` `/search?q=${keyword}` ``"
      explain: "`&` 会被当作参数之间的分隔符，`+` 会被解析成空格，服务器收到的关键词就错了。"
    - text: "`'/search?q=' + keyword.replaceAll(' ', '%20')`"
      explain: 只处理了空格，`&` 和 `+` 仍然会出错。
